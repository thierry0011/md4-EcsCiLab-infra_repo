AWSTemplateFormatVersion: '2010-09-09'
Description: >
  ECS CI/CD Lab - CodePipeline + CodeDeploy blue/green deployment, triggered
  by an EventBridge rule that fires on every new image push to ECR.
  Deploy AFTER the 04-ecs-alb stack (it needs the cluster/service/target
  groups/listeners that stack creates). Service roles (CodePipeline,
  CodeDeploy, EventBridge) live in 00-iam-roles.yaml, imported below.

Parameters:
  EnvironmentName:
    Type: String
    Default: ecs-cicd-lab

Resources:
  # Artifact / source bucket
  # GitHub Actions uploads the zipped appspec + taskdef here after each build; CodePipeline also uses it as its artifact store
  ArtifactBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ${EnvironmentName}-artifacts-${AWS::AccountId}-${AWS::Region}
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-artifacts

  # CodeDeploy application
  CodeDeployApplication:
    Type: AWS::CodeDeploy::Application
    Properties:
      ApplicationName: !Sub ${EnvironmentName}-app
      ComputePlatform: ECS

  CodeDeployDeploymentGroup:
    Type: AWS::CodeDeploy::DeploymentGroup
    Properties:
      ApplicationName: !Ref CodeDeployApplication
      DeploymentGroupName: !Sub ${EnvironmentName}-dg
      ServiceRoleArn: !ImportValue
        Fn::Sub: ${EnvironmentName}-CodeDeployServiceRoleArn
      DeploymentConfigName: CodeDeployDefault.ECSAllAtOnce
      DeploymentStyle:
        DeploymentType: BLUE_GREEN
        DeploymentOption: WITH_TRAFFIC_CONTROL
      BlueGreenDeploymentConfiguration:
        TerminateBlueInstancesOnDeploymentSuccess:
          Action: TERMINATE
          TerminationWaitTimeInMinutes: 5
        DeploymentReadyOption:
          ActionOnTimeout: CONTINUE_DEPLOYMENT
          WaitTimeInMinutes: 0
      ECSServices:
        - ClusterName: !ImportValue
            Fn::Sub: ${EnvironmentName}-ClusterName
          ServiceName: !ImportValue
            Fn::Sub: ${EnvironmentName}-ServiceName
      LoadBalancerInfo:
        TargetGroupPairInfoList:
          - TargetGroups:
              - Name: !ImportValue
                  Fn::Sub: ${EnvironmentName}-BlueTargetGroupName
              - Name: !ImportValue
                  Fn::Sub: ${EnvironmentName}-GreenTargetGroupName
            ProdTrafficRoute:
              ListenerArns:
                - !ImportValue
                  Fn::Sub: ${EnvironmentName}-ProdListenerArn
            TestTrafficRoute:
              ListenerArns:
                - !ImportValue
                  Fn::Sub: ${EnvironmentName}-TestListenerArn

  # CodePipeline
  Pipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name: !Sub ${EnvironmentName}-pipeline
      RoleArn: !ImportValue
        Fn::Sub: ${EnvironmentName}-CodePipelineServiceRoleArn
      ArtifactStore:
        Type: S3
        Location: !Ref ArtifactBucket
      Stages:
        - Name: Source
          Actions:
            # GitHub Actions bakes the pushed image URI into taskdef.json before uploading, so this pipeline never talks to ECR directly
            - Name: AppSpecSource
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: S3
                Version: '1'
              Configuration:
                S3Bucket: !Ref ArtifactBucket
                S3ObjectKey: source/appspec-taskdef.zip
                PollForSourceChanges: false
              OutputArtifacts:
                - Name: AppSpecSourceArtifact
              RunOrder: 1
        - Name: Deploy
          Actions:
            - Name: BlueGreenDeploy
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Provider: CodeDeployToECS
                Version: '1'
              InputArtifacts:
                - Name: AppSpecSourceArtifact
              Configuration:
                ApplicationName: !Ref CodeDeployApplication
                DeploymentGroupName: !Ref CodeDeployDeploymentGroup
                TaskDefinitionTemplateArtifact: AppSpecSourceArtifact
                TaskDefinitionTemplatePath: taskdef.json
                AppSpecTemplateArtifact: AppSpecSourceArtifact
                AppSpecTemplatePath: appspec.yaml
              RunOrder: 1

  # EventBridge: new ECR image push starts the pipeline
  EcrPushRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub ${EnvironmentName}-ecr-push-rule
      Description: Triggers the CodePipeline blue/green deployment on every new ECR image push
      EventPattern:
        source:
          - aws.ecr
        detail-type:
          - 'ECR Image Action'
        detail:
          action-type:
            - PUSH
          repository-name:
            - !ImportValue
              Fn::Sub: ${EnvironmentName}-EcrRepositoryName
          result:
            - SUCCESS
      Targets:
        - Arn: !Sub arn:aws:codepipeline:${AWS::Region}:${AWS::AccountId}:${Pipeline}
          Id: PipelineTarget
          RoleArn: !ImportValue
            Fn::Sub: ${EnvironmentName}-EventBridgeInvokePipelineRoleArn

Outputs:
  ArtifactBucketName:
    Value: !Ref ArtifactBucket
    Export:
      Name: !Sub ${EnvironmentName}-ArtifactBucketName
  ArtifactBucketArn:
    Value: !GetAtt ArtifactBucket.Arn
    Export:
      Name: !Sub ${EnvironmentName}-ArtifactBucketArn
  PipelineName:
    Value: !Ref Pipeline
    Export:
      Name: !Sub ${EnvironmentName}-PipelineName
