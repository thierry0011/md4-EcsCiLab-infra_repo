AWSTemplateFormatVersion: '2010-09-09'
Description: >
  ECS CI/CD Lab - CodePipeline + CodeDeploy blue/green deployment, triggered
  by an EventBridge rule that fires on every new image push to ECR.
  Deploy AFTER the 04-ecs-alb stack (it needs the cluster/service/target
  groups/listeners that stack creates).

Parameters:
  EnvironmentName:
    Type: String
    Default: ecs-cicd-lab

Resources:
  # ---------------- Artifact / source bucket ----------------
  # GitHub Actions uploads appspec.yaml + taskdef.json (zipped) here after
  # every successful image build. CodePipeline also uses this bucket as its
  # own artifact store.
  ArtifactBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ${EnvironmentName}-artifacts-${AWS::AccountId}-${AWS::Region}
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-artifacts

  # ---------------- IAM: CodePipeline ----------------
  CodePipelineServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${EnvironmentName}-codepipeline-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codepipeline.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: pipeline-permissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ArtifactBucketAccess
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:PutObject
                  - s3:GetBucketVersioning
                Resource:
                  - !GetAtt ArtifactBucket.Arn
                  - !Sub ${ArtifactBucket.Arn}/*
              - Sid: CodeDeployAccess
                Effect: Allow
                Action:
                  - codedeploy:CreateDeployment
                  - codedeploy:GetDeployment
                  - codedeploy:GetDeploymentConfig
                  - codedeploy:GetApplication
                  - codedeploy:GetApplicationRevision
                  - codedeploy:RegisterApplicationRevision
                Resource: '*'
              - Sid: EcsTaskDefRegistration
                Effect: Allow
                Action:
                  - ecs:RegisterTaskDefinition
                  - ecs:DescribeTaskDefinition
                  - ecs:DescribeServices
                Resource: '*'
              - Sid: PassEcsRoles
                Effect: Allow
                Action: iam:PassRole
                Resource:
                  - !ImportValue
                    Fn::Sub: ${EnvironmentName}-TaskExecutionRoleArn
                  - !ImportValue
                    Fn::Sub: ${EnvironmentName}-TaskRoleArn
                Condition:
                  StringEquals:
                    iam:PassedToService: ecs-tasks.amazonaws.com

  # ---------------- IAM: CodeDeploy ----------------
  CodeDeployServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${EnvironmentName}-codedeploy-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codedeploy.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AWSCodeDeployRoleForECS

  # ---------------- CodeDeploy application ----------------
  CodeDeployApplication:
    Type: AWS::CodeDeploy::Application
    Properties:
      ApplicationName: !Sub ${EnvironmentName}-app
      ComputePlatform: ECS

  CodeDeployDeploymentGroup:
    Type: AWS::CodeDeploy::DeploymentGroup
    Properties:
      ApplicationName: !Ref CodeDeployApplication
      DeploymentGroupName: !Sub ${EnvironmentName}-dg
      ServiceRoleArn: !GetAtt CodeDeployServiceRole.Arn
      DeploymentConfigName: CodeDeployDefault.ECSAllAtOnce
      DeploymentStyle:
        DeploymentType: BLUE_GREEN
        DeploymentOption: WITH_TRAFFIC_CONTROL
      BlueGreenDeploymentConfiguration:
        TerminateBlueInstancesOnDeploymentSuccess:
          Action: TERMINATE
          TerminationWaitTimeInMinutes: 5
        DeploymentReadyOption:
          ActionOnTimeout: CONTINUE_DEPLOYMENT
          WaitTimeInMinutes: 0
      ECSServices:
        - ClusterName: !ImportValue
            Fn::Sub: ${EnvironmentName}-ClusterName
          ServiceName: !ImportValue
            Fn::Sub: ${EnvironmentName}-ServiceName
      LoadBalancerInfo:
        TargetGroupPairInfoList:
          - TargetGroups:
              - Name: !ImportValue
                  Fn::Sub: ${EnvironmentName}-BlueTargetGroupName
              - Name: !ImportValue
                  Fn::Sub: ${EnvironmentName}-GreenTargetGroupName
            ProdTrafficRoute:
              ListenerArns:
                - !ImportValue
                  Fn::Sub: ${EnvironmentName}-ProdListenerArn
            TestTrafficRoute:
              ListenerArns:
                - !ImportValue
                  Fn::Sub: ${EnvironmentName}-TestListenerArn

  # ---------------- CodePipeline ----------------
  Pipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name: !Sub ${EnvironmentName}-pipeline
      RoleArn: !GetAtt CodePipelineServiceRole.Arn
      ArtifactStore:
        Type: S3
        Location: !Ref ArtifactBucket
      Stages:
        - Name: Source
          Actions:
            # GitHub Actions resolves the exact image URI it just pushed to
            # ECR straight into taskdef.json and zips it with appspec.yaml
            # before uploading here - so this pipeline never needs to talk
            # to ECR itself, and the immutable per-build tag never has to
            # double as a mutable "latest" pointer.
            - Name: AppSpecSource
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: S3
                Version: '1'
              Configuration:
                S3Bucket: !Ref ArtifactBucket
                S3ObjectKey: source/appspec-taskdef.zip
                PollForSourceChanges: false
              OutputArtifacts:
                - Name: AppSpecSourceArtifact
              RunOrder: 1
        - Name: Deploy
          Actions:
            - Name: BlueGreenDeploy
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Provider: CodeDeployToECS
                Version: '1'
              InputArtifacts:
                - Name: AppSpecSourceArtifact
              Configuration:
                ApplicationName: !Ref CodeDeployApplication
                DeploymentGroupName: !Ref CodeDeployDeploymentGroup
                TaskDefinitionTemplateArtifact: AppSpecSourceArtifact
                TaskDefinitionTemplatePath: taskdef.json
                AppSpecTemplateArtifact: AppSpecSourceArtifact
                AppSpecTemplatePath: appspec.yaml
              RunOrder: 1

  # ---------------- EventBridge: new ECR image -> start pipeline ----------------
  EventBridgeInvokePipelineRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${EnvironmentName}-eventbridge-pipeline-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: start-pipeline
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: codepipeline:StartPipelineExecution
                Resource: !Sub arn:aws:codepipeline:${AWS::Region}:${AWS::AccountId}:${Pipeline}

  EcrPushRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub ${EnvironmentName}-ecr-push-rule
      Description: Triggers the CodePipeline blue/green deployment on every new ECR image push
      EventPattern:
        source:
          - aws.ecr
        detail-type:
          - 'ECR Image Action'
        detail:
          action-type:
            - PUSH
          repository-name:
            - !ImportValue
              Fn::Sub: ${EnvironmentName}-EcrRepositoryName
          result:
            - SUCCESS
      Targets:
        - Arn: !Sub arn:aws:codepipeline:${AWS::Region}:${AWS::AccountId}:${Pipeline}
          Id: PipelineTarget
          RoleArn: !GetAtt EventBridgeInvokePipelineRole.Arn

Outputs:
  ArtifactBucketName:
    Value: !Ref ArtifactBucket
    Export:
      Name: !Sub ${EnvironmentName}-ArtifactBucketName
  ArtifactBucketArn:
    Value: !GetAtt ArtifactBucket.Arn
    Export:
      Name: !Sub ${EnvironmentName}-ArtifactBucketArn
  PipelineName:
    Value: !Ref Pipeline
    Export:
      Name: !Sub ${EnvironmentName}-PipelineName
